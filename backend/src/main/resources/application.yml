spring:
  application:
    name: grace-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grace}
    username: ${SPRING_DATASOURCE_USERNAME:grace}
    password: ${SPRING_DATASOURCE_PASSWORD:grace_secure_password_change_me}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    locations: classpath:db/migration

grace:
  security:
    jwt-secret: ${JWT_SECRET:change_this_to_a_secure_random_string_minimum_32_characters}
    jwt-issuer: ${JWT_ISSUER:grace}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
  bootstrap:
    admin-email: ${GRACE_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${GRACE_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${GRACE_BOOTSTRAP_ADMIN_NAME:GRACE Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
