spring:
  application:
    name: grace-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grace}
    username: ${SPRING_DATASOURCE_USERNAME:grace}
    password: ${SPRING_DATASOURCE_PASSWORD:grace_secure_password_change_me}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      connect-timeout: ${SPRING_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_REDIS_TIMEOUT:2s}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    locations: classpath:db/migration

grace:
  public-base-url: ${GRACE_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt-secret: ${JWT_SECRET:change_this_to_a_secure_random_string_minimum_32_characters}
    jwt-issuer: ${JWT_ISSUER:grace}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
  bootstrap:
    admin-email: ${GRACE_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${GRACE_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${GRACE_BOOTSTRAP_ADMIN_NAME:GRACE Administrator}
  search:
    url: ${OPENSEARCH_URL:http://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}}
    sync-interval-ms: ${SEARCH_SYNC_INTERVAL_MS:60000}
    initial-delay-ms: ${SEARCH_INITIAL_DELAY_MS:15000}
  mcp:
    audience: ${GRACE_MCP_AUDIENCE:grace-mcp}
    authorization-server: ${GRACE_MCP_AUTHORIZATION_SERVER:http://localhost:8180/realms/grace}
    allowed-origins: ${GRACE_MCP_ALLOWED_ORIGINS:http://localhost:3000}
  cors:
    allowed-origins: ${GRACE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    enabled: ${GRACE_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${GRACE_RATE_LIMIT_LOGIN_PER_MINUTE:10}
    mcp-per-minute: ${GRACE_RATE_LIMIT_MCP_PER_MINUTE:120}
    public-per-minute: ${GRACE_RATE_LIMIT_PUBLIC_PER_MINUTE:240}

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:ecs}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
